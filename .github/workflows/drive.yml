name: Build APK with Drive
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PagesForTV-android-project.zip
      - run: |
          sed -i "s|__CLIENT_ID__|$GID|; s|__CLIENT_SECRET__|$GSEC|" PagesForTV/app/src/main/assets/index.html
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: PagesForTV
      - uses: actions/upload-artifact@v4
        with:
          name: PagesForTV-apk
          path: PagesForTV/app/build/outputs/apk/debug/app-debug.apk
